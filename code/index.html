<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CyberQuest</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="pixel-art-body">

    <header class="pixel-header">
        <h1>CyberQuest</h1>
    </header>

    <main class="pixel-main-content">
        
        <div class="welcome-container">
            <h2>:: Welcome, Explorer! ::</h2>
            
            <p>Please enter your name:</p>
            <input type="text" id="name-input" class="pixel-input" placeholder="Your name...">
            
            <p>Please choose your journey:</p>
            <button id="btn-child" class="portal-button child">Child Zone (6-12 years)</button>
            <button id="btn-teen" class="portal-button teen">Teen Zone (13+ years)</button>
        </div>

    </main>

    <script type="module" src="welcome.js"></script>
</body>
</html>
