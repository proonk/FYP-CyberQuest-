<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuest - Welcome!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">


</head>
<body class="welcome-body">

    <header class="welcome-header">
        <h1 class="logo-font">
            ⚔️ CyberQuest
            <span class="logo-subtitle">:: CYBER SAFETY ADVENTURE ::</span>
        </h1>
    </header>

    <main class="welcome-main">
        <div class="welcome-portal">

            <span class="pixel-character">🧙</span>
            <h2>:: NEW ADVENTURER ::</h2>

            <label class="input-label" for="name-input">▶ ENTER YOUR NAME</label>
            <input
                type="text"
                id="name-input"
                class="welcome-input"
                placeholder="Explorer..."
                maxlength="20"
                autocomplete="off"
            >

            <button id="btn-start" class="welcome-button start-btn">
                <span class="btn-icon">⚔️</span>
                START ADVENTURE
            </button>

        </div>
    </main>

    </main> <div id="name-alert-overlay" class="alert-overlay">
        <div class="alert-box">
            <h2>⚠️ HALT! ⚠️</h2>
            <p>Adventurer, you must enter your name before entering the portal!</p>
            <button id="close-alert-btn" class="welcome-button" style="background-color: #FF0000; color: #FFF; border: 4px solid #FF6666;">I UNDERSTAND</button>
        </div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
