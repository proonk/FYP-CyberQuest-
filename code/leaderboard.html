<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuest - Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css"> <style>
        .leader-row {
            display: flex; justify-content: space-between;
            padding: 15px; border-bottom: 2px dashed #444;
        }
        .leader-row:nth-child(1) { color: #FFD700; font-size: 1.2rem; } /* Gold */
        .leader-row:nth-child(2) { color: #C0C0C0; } /* Silver */
        .leader-row:nth-child(3) { color: #CD7F32; } /* Bronze */
    </style>
</head>
<body class="pixel-art-body">
    <header class="pixel-header">
        <a href="welcome.html" class="back-button">:: Home ::</a>
        <h1>🏆 Leaderboard 🏆</h1>
    </header>

    <main class="pixel-main-content">
        <div id="leaderboard-list" style="background: #1a1a4a; padding: 20px; border: 4px solid #fff;">
            <p>Loading...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://brqisvltkrafajojozbr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJycWlzdmx0a3JhZmFqb2pvemJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExMjg1ODAsImV4cCI6MjA3NjcwNDU4MH0.BsGBK-ECEoC1SKRtHD0RZVL2m9iAOO8HKg7SLTnA8iM';
        const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadLeaderboard() {
            const { data, error } = await client
                .from('leaderboard')
                .select('*')
                .order('score', { ascending: false })
                .limit(10);

            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            if (data) {
                data.forEach((entry, index) => {
                    const row = document.createElement('div');
                    row.className = 'leader-row';
                    row.innerHTML = `
                        <span>#${index + 1} ${entry.username}</span>
                        <span>${entry.score} pts</span>
                    `;
                    list.appendChild(row);
                });
            }
        }
        loadLeaderboard();
    </script>
</body>
</html>
