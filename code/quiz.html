<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuest - Challenge</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body class="pixel-art-body">

    <header class="pixel-header">
        <a href="#" id="quiz-back-btn" class="back-button">:: Back ::</a>
        
        <h1>CyberQuest</h1>
        </header>

    <main class="pixel-main-content">
        <div id="quiz-container">
            <p class="loading-message">... L O A D I N G ...</p>
        </div>
    </main>
    
    <div id="boss-arena" style="display: none; text-align: center; margin-bottom: 20px; background-color: #1a1a4a; padding: 20px; border: 4px solid #FF0000; box-shadow: 8px 8px 0px #000;">
        <img src="img/Boss.gif" id="boss-img" width="150" style="image-rendering: pixelated; margin-bottom: 15px;">
        
        <div id="boss-hp-container" style="width: 80%; margin: 0 auto; background: #000; border: 4px solid #fff; height: 25px;">
            <div id="boss-hp-bar" style="width: 100%; height: 100%; background: #FF0000; transition: width 0.3s ease-in-out;"></div>
        </div>
        <p style="color: #FF0000; margin-top: 10px; font-weight: bold; font-size: 1.2rem;">HACKER BOSS HP</p>
        
        <div id="player-stats" style="margin-top: 15px; background: #000; display: inline-block; padding: 10px 20px; border: 2px solid #00FF00;">
            <span style="color: #00FF00; font-size: 1rem;">Your Lives: </span>
            <span id="player-hearts" style="font-size: 1.2rem;">❤️❤️❤️</span>
        </div>
    </div>

    <div id="feedback-overlay" class="modal-overlay">
        <div id="feedback-box" class="feedback-modal">
            <h2 id="feedback-title"></h2>
            <p id="feedback-text" class="feedback-message"></p>
            <button id="next-question-btn" class="welcome-button child-btn" style="margin-top: 20px; font-size: 1.2rem;">Next Question ➡</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/quiz.js"></script>
</body>
</html>
